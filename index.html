<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kado Ulang Tahun</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    background:linear-gradient(#87ceeb,#ffffff);
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.stage{
    position:relative;
    width:100%;
    max-width:520px;
    height:85vh;
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

.layer{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border-radius:18px;
    opacity:0;
    animation:drop 1s forwards;
    cursor:pointer;
}

.big{
    width:320px;
    height:90px;
    background:#d2691e;
    bottom:0;
    animation-delay:0s;
}

.medium{
    width:240px;
    height:75px;
    background:#f4a460;
    bottom:100px;
    animation-delay:1s;
}

.small{
    width:170px;
    height:55px;
    background:#ffe4b5;
    bottom:190px;
    animation-delay:2s;
}

.candle{
    width:14px;
    height:70px;
    background:red;
    bottom:270px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    animation-delay:3s;
}

.flame{
    position:absolute;
    width:22px;
    height:22px;
    background:orange;
    border-radius:50%;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 0 14px orange;
    animation:flicker 0.3s infinite alternate;
}

@keyframes drop{
    0%{
        transform:translate(-50%,-300px);
        opacity:0;
    }
    100%{
        transform:translate(-50%,0);
        opacity:1;
    }
}

@keyframes flicker{
    from{
        transform:translateX(-50%) scale(1);
    }
    to{
        transform:translateX(-50%) scale(1.3);
    }
}

/* Tombol ulang */
.btn{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 15px;
    background:#ff4081;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    z-index:30;
}

/* Kartu */
.card-container{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    perspective:1200px;
    z-index:20;
}

.card{
    width:320px;
    height:430px;
    position:relative;
    transform-style:preserve-3d;
    transition:1s;
    cursor:pointer;
}

.card.open{
    transform:rotateY(-180deg);
}

.card-front,
.card-inside{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:15px;
    backface-visibility:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.card-front{
    background:linear-gradient(135deg,#ff4081,#ff80ab);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:24px;
    font-weight:bold;
}

.card-front span{
    font-size:60px;
}

.card-inside{
    background:white;
    transform:rotateY(180deg);
    padding:15px;
    box-sizing:border-box;
    text-align:center;
}

.arc-text{
    width:100%;
    height:90px;
}

.card-inside img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
}

.card-inside p{
    margin-top:15px;
    line-height:1.5;
    font-weight:bold;
    color:#333;
}

/* Confetti */
.confetti{
    position:fixed;
    width:8px;
    height:12px;
    top:-10px;
    opacity:0.9;
    animation:fall 3s linear forwards;
    z-index:5;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* Balloon */
.balloon{
    position:fixed;
    bottom:-100px;
    width:25px;
    height:35px;
    border-radius:50%;
    animation:rise 6s linear forwards;
    z-index:4;
}

@keyframes rise{
    to{
        transform:translateY(-120vh);
    }
}
</style>
</head>
<body>

<button class="btn" onclick="restart()">Ulang 🎂</button>

<div class="stage">

    <div class="layer big" onclick="showGift()"></div>
    <div class="layer medium" onclick="showGift()"></div>
    <div class="layer small" onclick="showGift()"></div>

    <div class="layer candle" onclick="showGift()">
        <div class="flame" id="flame"></div>
    </div>

    <!-- Kartu -->
    <div class="card-container" id="cardContainer">
        <div class="card" id="card" onclick="openCard()">

            <div class="card-front">
                <span>📖</span>
                Klik Untuk Membuka
            </div>

            <div class="card-inside">

                <svg class="arc-text" viewBox="0 0 300 80">
                    <defs>
                        <path id="curve" d="M10,60 Q150,-20 290,60"/>
                    </defs>
                    <text>
                        <textPath href="#curve"
                                  startOffset="50%"
                                  text-anchor="middle"
                                  fill="#ff4081"
                                  font-size="30">
                            🎁 Happy Birthday 🎉
                        </textPath>
                    </text>
                </svg>

                <img src="WhatsApp Image 2026-06-01 at 04.39.52.jpeg" alt="Foto">

                <p>
                    Selamat ulang tahun Monti 🎂<br>
                    Semoga panjang umur, sehat selalu,
                    rezekinya lancar, dan semua impianmu
                    satu per satu terwujud yaaa aminnnn ✨
                </p>

            </div>

        </div>
    </div>

</div>

<script>

function createConfetti(){
    for(let i=0;i<80;i++){
        let c=document.createElement('div');
        c.classList.add('confetti');

        c.style.left=Math.random()*100+'vw';

        c.style.background=
        ['#ff4081','#ffeb3b','#4caf50','#2196f3']
        [Math.floor(Math.random()*4)];

        c.style.animationDuration=
        (2+Math.random()*3)+'s';

        document.body.appendChild(c);

        setTimeout(()=>{
            c.remove();
        },5000);
    }
}

function createBalloons(){
    for(let i=0;i<15;i++){

        let b=document.createElement('div');

        b.classList.add('balloon');

        b.style.left=Math.random()*100+'vw';

        b.style.background=
        ['#ff4081','#ff9800','#4caf50','#03a9f4']
        [Math.floor(Math.random()*4)];

        b.style.animationDuration=
        (5+Math.random()*3)+'s';

        document.body.appendChild(b);

        setTimeout(()=>{
            b.remove();
        },8000);
    }
}

function showGift(){

    document.getElementById('flame').style.display='none';

    document.getElementById('cardContainer').style.display='block';

    createConfetti();
    createBalloons();
}

function openCard(){
    document.getElementById('card')
            .classList.toggle('open');
}

function restart(){

    document.getElementById('flame').style.display='block';

    document.getElementById('cardContainer').style.display='none';

    document.getElementById('card')
            .classList.remove('open');
}
</script>

</body>
</html>
