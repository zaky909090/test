<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kado Ulang Tahun</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    background: linear-gradient(135deg, #8E2DE2, #C471ED, #F5F7FA);
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.stage{
    position:relative;
    width:100%;
    max-width:900px;
    height:85vh;
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

/* CAKE */
.layer{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border-radius:18px;
    opacity:0;
    animation:drop 1s forwards;
    cursor:pointer;
}

.big{
    width:320px;
    height:90px;
    background:#d2691e;
    bottom:0;
}

.medium{
    width:240px;
    height:75px;
    background:#f4a460;
    bottom:100px;
    animation-delay:1s;
}

.small{
    width:170px;
    height:55px;
    background:#ffe4b5;
    bottom:190px;
    animation-delay:2s;
}

.candle{
    width:14px;
    height:70px;
    background:red;
    bottom:270px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    animation-delay:3s;
}

.flame{
    position:absolute;
    width:22px;
    height:22px;
    background:orange;
    border-radius:50%;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 0 14px orange;
    animation:flicker .3s infinite alternate;
}

/* ANIMATION */
@keyframes drop{
    0%{transform:translate(-50%,-300px);opacity:0;}
    100%{transform:translate(-50%,0);opacity:1;}
}

@keyframes flicker{
    from{transform:translateX(-50%) scale(1);}
    to{transform:translateX(-50%) scale(1.3);}
}

/* BUTTON */
.btn{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:white;
    cursor:pointer;
    z-index:50;
}

/* BOOK */
.book-container{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    z-index:30;
}

.book{
    width:min(850px,95vw);
    height:380px;
    position:relative;
    perspective:1500px;
}

/* PAGE */
.page{
    position:absolute;
    width:50%;
    height:100%;
    background:white;
    box-shadow:0 0 15px rgba(0,0,0,.15);
    padding:12px;
    box-sizing:border-box;

    opacity:0;
    visibility:hidden;
    transition:.6s;

    display:flex;
    flex-direction:column;
    justify-content:flex-start;
}

/* =======================
   KIRI (HANYA FOTO + TITLE)
======================= */
.left-page{
    left:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:10px;
}

.left-page img{
    width:100%;
    height:75%;
    object-fit:cover;
    border-radius:12px;
}

.left-page h2{
    color:#ff4081;
    font-size:18px;
    margin:0;
}

/* =======================
   KANAN (FULL TEKS)
======================= */
.right-page{
    left:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:15px;
}

.right-page h2{
    color:#ff4081;
    font-size:16px;
    margin-bottom:10px;
}

.right-page p{
    font-size:13px;
    line-height:1.5;
}

/* COVER */
.cover{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    transform-origin:left center;

    width:50%;
    height:100%;

    background:linear-gradient(135deg,#ff4081,#ff80ab);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;

    transition:1s;
    opacity:1;
    visibility:visible;

    z-index:10;
    border-radius:15px;
    box-shadow:10px 0 20px rgba(0,0,0,.2);
}

.book.open .cover{
    transform:translate(-50%, -50%) rotateY(-180deg);
    opacity:0;
    visibility:hidden;
}
.book.open .page{
    opacity:1;
    visibility:visible;
}

/* MOBILE */
@media (max-width: 768px){

    .book{
        width:95vw;
        height:260px;
    }

    .page{
        padding:8px;
    }

    .left-page h2{
        font-size:12px;
    }

    .right-page h2{
        font-size:12px;
    }

    .right-page p{
        font-size:10px;
        line-height:1.3;
    }

    .left-page img{
        height:70%;
    }

    .cover{
        font-size:12px;
    }

   .hint{
    position:fixed;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,.8);
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
    color:#ff4081;
    z-index:50;
}
.balloon{
    position:fixed;
    bottom:-100px;
    width:50px;
    height:65px;
    border-radius:50%;
    animation:fly 6s linear forwards;
    z-index:100;
}

.balloon::after{
    content:'';
    position:absolute;
    width:2px;
    height:60px;
    background:#555;
    left:50%;
    top:60px;
}

@keyframes fly{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    100%{
        transform:translateY(-120vh);
        opacity:0;
    }
}
}

    
</style>
</head>

<body>

<button class="btn" onclick="restart()">Ulang 🎂</button>

<div class="stage">

    <div class="layer big" onclick="showGift()"></div>
    <div class="layer medium" onclick="showGift()"></div>
    <div class="layer small" onclick="showGift()"></div>

    <div id="hint" class="hint">
    🎂 Klik lilin untuk meniup lilin
</div>

    <div class="layer candle" onclick="showGift()">
        <div class="flame" id="flame"></div>
    </div>

    <div class="book-container" id="bookContainer">

       <div class="book" id="book" onclick="toggleBook()">

            <div class="cover">
                📖<br><br>
                Klik Untuk Membuka
            </div>

            <!-- KIRI: FOTO + TITLE -->
            <div class="page left-page">
                <h2>🎂 Happy Birthday</h2>
                <img src="WhatsApp Image 2026-06-01 at 04.39.52.jpeg">
            </div>

            <!-- KANAN: FULL TEKS -->
            <div class="page right-page">
                <h2>✨ Untuk kakak ✨</h2>
                <p>
                    Selamat ulang tahun 🎉<br><br>
                    Semoga panjang umur, sehat selalu,<br>
                    bahagia terus, rezeki lancar,<br>
                    dan semua impian kamu tercapai ✨<br><br>
                    Tetap jadi orang yang baik 💖
                </p>
            </div>

        </div>
    </div>
</div>
</div>

<script>
function showGift(){

    const flame = document.getElementById('flame');

    flame.style.transition = "0.5s";
    flame.style.opacity = "0";
    flame.style.transform = "translateX(-50%) scale(0)";

    document.getElementById('hint').style.display = 'none';

    setTimeout(() => {
        flame.style.display = 'none';
        document.getElementById('bookContainer').style.display = 'block';
    }, 500);
}


function toggleBook(){

    const book = document.getElementById('book');
    const song = document.getElementById('birthdaySong');

    book.classList.toggle('open');

    if(book.classList.contains('open')){
        song.play();
        createBalloons();
    }else{
        song.pause();
        song.currentTime = 0;
    }
}


function createBalloons(){

    const colors = [
        '#ff4081',
        '#2196f3',
        '#4caf50',
        '#ff9800',
        '#9c27b0',
        '#f44336'
    ];

    for(let i=0;i<20;i++){

        const balloon = document.createElement('div');
        balloon.classList.add('balloon');

        balloon.style.left = Math.random()*100 + 'vw';
        balloon.style.background =
            colors[Math.floor(Math.random()*colors.length)];

        balloon.style.animationDuration =
            (4 + Math.random()*4) + 's';

        document.body.appendChild(balloon);

        setTimeout(()=>{
            balloon.remove();
        },8000);
    }
}

function restart(){

    document.getElementById('hint').style.display = 'block';

    const flame = document.getElementById('flame');

    flame.style.display = 'block';
    flame.style.opacity = '1';
    flame.style.transform = 'translateX(-50%) scale(1)';
    flame.style.transition = '0s';

    document.getElementById('bookContainer').style.display='none';
    document.getElementById('book').classList.remove('open');

    const big = document.querySelector('.big');
    const medium = document.querySelector('.medium');
    const small = document.querySelector('.small');
    const candle = document.querySelector('.candle');

    [big, medium, small, candle].forEach(el=>{
        el.style.animation='none';
        el.offsetHeight;
    });

    big.style.animation='drop 1s forwards';
    medium.style.animation='drop 1s forwards 1s';
    small.style.animation='drop 1s forwards 2s';
    candle.style.animation='drop 1s forwards 3s';
}

const song = document.getElementById('birthdaySong');
song.pause();
song.currentTime = 0;
</script>

<audio id="birthdaySong" loop>
    <source src="happy-birthday.mp3" type="audio/mpeg">
</audio>

</body>
</html>>
