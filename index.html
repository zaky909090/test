<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kado Ulang Tahun</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    background:linear-gradient(#87ceeb,#ffffff);
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.stage{
    position:relative;
    width:100%;
    max-width:900px;
    height:85vh;
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

/* KUE */
.layer{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border-radius:18px;
    opacity:0;
    animation:drop 1s forwards;
    cursor:pointer;
}

.big{
    width:320px;
    height:90px;
    background:#d2691e;
    bottom:0;
    animation-delay:0s;
}

.medium{
    width:240px;
    height:75px;
    background:#f4a460;
    bottom:100px;
    animation-delay:1s;
}

.small{
    width:170px;
    height:55px;
    background:#ffe4b5;
    bottom:190px;
    animation-delay:2s;
}

.candle{
    width:14px;
    height:70px;
    background:red;
    bottom:270px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    animation-delay:3s;
}

.flame{
    position:absolute;
    width:22px;
    height:22px;
    background:orange;
    border-radius:50%;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 0 14px orange;
    animation:flicker .3s infinite alternate;
}

@keyframes drop{
    0%{
        transform:translate(-50%,-300px);
        opacity:0;
    }
    100%{
        transform:translate(-50%,0);
        opacity:1;
    }
}

@keyframes flicker{
    from{transform:translateX(-50%) scale(1);}
    to{transform:translateX(-50%) scale(1.3);}
}

/* TOMBOL */
.btn{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:white;
    cursor:pointer;
    z-index:50;
}

/* BUKU */
.book-container{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    z-index:30;
}

.book{
    width:850px;
    max-width:95vw;
    height:500px;
    position:relative;
}

.page{
    position:absolute;
    width:50%;
    height:100%;
    background:white;
    box-shadow:0 0 15px rgba(0,0,0,.15);
    padding:20px;
    box-sizing:border-box;

    opacity:0;
    visibility:hidden;
    transition:.6s;
}

.left-page{
    left:0;
}

.right-page{
    left:50%;
}

.page h2{
    text-align:center;
    color:#ff4081;
}

.page img{
    width:100%;
    height:350px;
    object-fit:cover;
    border-radius:12px;
}
.page p{
    text-align:center;
    line-height:1.7;
    font-size:17px;
}

.cover{
    position:absolute;
    left:0;
    width:50%;
    height:100%;
    background:linear-gradient(135deg,#ff4081,#ff80ab);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
    transform-origin:left;
    transition:1s;
    z-index:10;
    border-radius:0 15px 15px 0;
}

.book.open .cover{
    transform:rotateY(-180deg);
}

.book.open .page{
    opacity:1;
    visibility:visible;
}

/* CONFETTI */
.confetti{
    position:fixed;
    width:8px;
    height:12px;
    top:-20px;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* BALON */
.balloon{
    position:fixed;
    bottom:-100px;
    width:25px;
    height:35px;
    border-radius:50%;
    animation:rise 6s linear forwards;
}

@keyframes rise{
    to{
        transform:translateY(-120vh);
    }
}

@media(max-width:768px){

    .book{
        width:95vw;
        height:350px;
    }

    .page{
        padding:10px;
    }

    .page p{
        font-size:14px;
    }

    .cover{
        font-size:18px;
    }
}
</style>
</head>
<body>

<button class="btn" onclick="restart()">Ulang 🎂</button>

<div class="stage">

    <div class="layer big" onclick="showGift()"></div>
    <div class="layer medium" onclick="showGift()"></div>
    <div class="layer small" onclick="showGift()"></div>

    <div class="layer candle" onclick="showGift()">
        <div class="flame" id="flame"></div>
    </div>

    <!-- BUKU -->
    <div class="book-container" id="bookContainer">

        <div class="book" id="book">

            <div class="cover" onclick="openBook()">
                <div>
                    📖<br><br>
                    Klik Untuk Membuka
                </div>
            </div>

            <div class="page left-page">
                <h2>🎂 Happy Birthday</h2>

                <img src="WhatsApp Image 2026-06-01 at 04.39.52.jpeg" alt="Foto">
            </div>

            <div class="page right-page">
                <h2>✨ Untuk Monti ✨</h2>

                <p>
                    Selamat ulang tahun Monti 🎂
                    <br><br>

                    Semoga panjang umur,
                    sehat selalu,
                    rezekinya lancar,
                    dan semua impianmu
                    satu per satu terwujud.

                    <br><br>

                    Tetap jadi pribadi yang baik,
                    bahagia selalu,
                    dan semoga semua harapanmu
                    dikabulkan. ✨
                </p>
            </div>

        </div>

    </div>

</div>

<script>

function createConfetti(){
    for(let i=0;i<80;i++){

        let c=document.createElement('div');
        c.className='confetti';

        c.style.left=Math.random()*100+'vw';

        c.style.background=
        ['#ff4081','#ffeb3b','#4caf50','#2196f3']
        [Math.floor(Math.random()*4)];

        document.body.appendChild(c);

        setTimeout(()=>{
            c.remove();
        },3000);
    }
}

function createBalloons(){

    for(let i=0;i<15;i++){

        let b=document.createElement('div');

        b.className='balloon';

        b.style.left=Math.random()*100+'vw';

        b.style.background=
        ['#ff4081','#ff9800','#4caf50','#03a9f4']
        [Math.floor(Math.random()*4)];

        document.body.appendChild(b);

        setTimeout(()=>{
            b.remove();
        },6000);
    }
}

function showGift(){

    document.getElementById('flame').style.display='none';

    document.getElementById('bookContainer').style.display='block';

    createConfetti();
    createBalloons();
}

function openBook(){

    document.getElementById('book')
            .classList.add('open');
}

function restart(){

    document.getElementById('flame').style.display='block';

    document.getElementById('bookContainer').style.display='none';

    document.getElementById('book')
            .classList.remove('open');
}

</script>

</body>
</html>
